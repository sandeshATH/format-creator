{% extends "base.html" %}
{% block content %}
  <section>
    <h2>1. Upload your Excel template</h2>
    <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
      <label for="template">Choose an .xlsx file</label>
      <input type="file" id="template" name="template" accept=".xlsx" required>
      <button type="submit">Upload</button>
    </form>
  </section>

  {% if has_template %}
    <section>
      <h2>2. Fill out the generated form</h2>
      <p>Your template is ready. Continue to the form to enter data for the first row.</p>
      <a role="button" href="{{ url_for('fill') }}">Go to form</a>
    </section>
  {% endif %}
{% endblock %}
