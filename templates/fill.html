{% extends "base.html" %}
{% block content %}
  <section>
    <h2>Fill out your data</h2>
    <p>Enter values for each column header detected in the uploaded template. Your entries will be written to the first data row.</p>
    <form action="{{ url_for('fill') }}" method="post">
      <div class="grid">
        {% for header in headers %}
          <label>
            {{ header }}
            <input type="text" name="{{ header }}" placeholder="Enter {{ header }}" required>
          </label>
        {% endfor %}
      </div>
      <button type="submit">Download filled Excel</button>
    </form>
    <p><a href="{{ url_for('index') }}">Upload a different template</a></p>
  </section>
{% endblock %}
